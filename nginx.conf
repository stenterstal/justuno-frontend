# Use Traefik's protocol (https), fall back to our own when hit directly
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Trust X-Forwarded-For from Traefik on the Docker network
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Don't use add_header inside a location: it drops these server-level headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Hashed build output: cache forever, never fall back to index.html
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # React SPA routing
    location / {
        try_files $uri /index.html;
        expires epoch;
    }
}
