services:
  postgres:
    image: postgres:16-alpine
    container_name: justuno-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uno
      POSTGRES_USER: uno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Lets the backend wait until migrations can actually run
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uno -d uno"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Change ./data mapping
    volumes:
      -  ./data:/var/lib/postgresql/data

  backend:
    image: ghcr.io/stenterstal/justuno-backend:latest
    container_name: justuno-backend
    restart: unless-stopped
    environment:
      DB_NAME: uno
      DB_USER: uno
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      # Generate with: python -c "import secrets; print(secrets.token_urlsafe(50))"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      # Change to your domain (localhost is always allowed by the backend)
      ALLOWED_HOSTS: yourdomain.com
    # Django admin, only reachable from the server itself.
    # Use an SSH tunnel: ssh -L 8888:localhost:8888 yourserver, then open localhost:8888/admin
    ports:
      - 127.0.0.1:8888:8000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/stenterstal/justuno-frontend:latest
    container_name: justuno-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Optional: overrides the nginx.conf baked into the image.
    # Remove this mount to use the image's config, or keep ./config/nginx.conf in sync with the repo.
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Change as needed
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uno.entryPoints=https"
      - "traefik.http.routers.uno.rule=Host(`yourdomain.com`)"
      - "traefik.http.routers.uno.tls=true"
      - "traefik.http.routers.uno.tls.certresolver=cloudflare"